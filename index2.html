<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV 위치 데이터 지도 시각화 시스템</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS (Cloudflare CDN for high reliability) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  
  <!-- Leaflet MarkerCluster -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  
  <!-- PapaParse for CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    #map {
      height: 100%;
      width: 100%;
      z-index: 10;
      background-color: #f8fafc;
    }

    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s ease-in-out;
    }
    
    .custom-marker:hover {
      transform: scale(1.2);
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

  <header class="bg-slate-900 text-white px-5 py-3.5 flex flex-wrap justify-between items-center shadow-md shrink-0 border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <div class="bg-amber-500 p-2 rounded-lg text-slate-950 font-bold flex items-center justify-center">
        <i class="fa-solid fa-map-location-dot text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          CSV 위치 데이터 지도 시각화
          <span class="text-xs font-normal bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full">v1.3</span>
        </h1>
        <p class="text-xs text-slate-400">위도/경도가 포함된 CSV 데이터를 업로드하여 지도 위에 한눈에 표시하세요</p>
      </div>
    </div>

    <!-- Quick Actions Header -->
    <div class="flex items-center space-x-2 mt-2 sm:mt-0">
      <button id="btnLoadSample" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-solar-panel text-amber-300"></i>
        <span>예시 데이터 로드 (시흥시 태양광)</span>
      </button>
      <button id="btnDownloadSampleCsv" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 transition-colors flex items-center gap-1.5">
        <i class="fa-solid fa-download"></i>
        <span>샘플 CSV 다운로드</span>
      </button>
    </div>
  </header>

  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- Sidebar / Control Panel -->
    <aside id="sidebar" class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col shrink-0 z-20 transition-all duration-300 overflow-y-auto">
      
      <!-- Drag & Drop CSV Upload Area -->
      <div class="p-4 border-b border-slate-100 bg-slate-50/50">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">1. CSV 파일 업로드</label>
        <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-amber-500 rounded-xl p-5 text-center bg-white cursor-pointer transition-all hover:bg-amber-50/30 group">
          <input type="file" id="csvFileInput" accept=".csv, .txt" class="hidden">
          <div class="w-12 h-12 bg-amber-100 group-hover:bg-amber-200 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-3 transition-colors">
            <i class="fa-solid fa-file-csv text-2xl"></i>
          </div>
          <p class="text-sm font-medium text-slate-700">CSV 파일을 이곳에 드래그하거나 클릭하세요</p>
          <p class="text-xs text-slate-400 mt-1">UTF-8 / EUC-KR 한글 인코딩 지원 (.csv)</p>
        </div>
      </div>

      <!-- Column Mapping Configuration -->
      <div class="p-4 border-b border-slate-100 space-y-3 bg-white">
        <div class="flex justify-between items-center">
          <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">2. 좌표 및 매핑 설정</label>
          <span id="mappingStatus" class="text-[11px] font-medium text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">데이터 대기중</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-500 mb-1 font-medium">위도 (Latitude) 컬럼</label>
            <select id="selectLat" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500">
              <option value="">-- 선택 --</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1 font-medium">경도 (Longitude) 컬럼</label>
            <select id="selectLng" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500">
              <option value="">-- 선택 --</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-500 mb-1 font-medium">마커 명칭 (Title) 컬럼</label>
          <select id="selectLabel" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option value="">-- 선택 --</option>
          </select>
        </div>

        <button id="btnApplyMapping" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold py-2 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>지도 데이터 새로고침</span>
        </button>
      </div>

      <!-- KPI Overview Cards -->
      <div class="p-4 border-b border-slate-100 bg-slate-50/50">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">3. 데이터 요약 통계</label>
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] text-slate-400 font-medium block">지도 표시 좌표 수</span>
            <span id="statValidCount" class="text-xl font-extrabold text-slate-800">0</span>
            <span class="text-[10px] text-slate-400">개 마커 생성</span>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] text-slate-400 font-medium block">총 설비 용량</span>
            <span id="statTotalCapacity" class="text-xl font-extrabold text-amber-600">0</span>
            <span class="text-[10px] text-slate-400">kW 합계</span>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] text-slate-400 font-medium block">누락/오류 좌표</span>
            <span id="statInvalidCount" class="text-xl font-extrabold text-rose-500">0</span>
            <span class="text-[10px] text-slate-400">행 제외됨</span>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <span class="text-[11px] text-slate-400 font-medium block">전체 데이터 수</span>
            <span id="statTotalRows" class="text-xl font-extrabold text-slate-800">0</span>
            <span class="text-[10px] text-slate-400">행 불러옴</span>
          </div>
        </div>
      </div>

      <!-- Search & Data Filter -->
      <div class="p-4 flex-1 flex flex-col min-h-[220px]">
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">4. 목록 및 검색</label>
          <span id="filteredCountText" class="text-xs text-slate-400">0건</span>
        </div>

        <div class="relative mb-2">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
          <input type="text" id="searchInput" placeholder="시설명, 주소 검색..." class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <!-- Data List Items Container -->
        <div id="dataListContainer" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-[300px] border border-slate-100 rounded-lg p-1 bg-slate-50/30">
          <div class="text-center py-8 text-xs text-slate-400">
            CSV 파일을 업로드하면 목록이 표시됩니다.
          </div>
        </div>
      </div>

    </aside>

    <!-- Map Content Panel -->
    <main class="flex-1 flex flex-col relative bg-slate-100 h-full">
      
      <!-- Top Control Bar over Map -->
      <div class="absolute top-3 left-3 right-3 z-20 flex flex-wrap gap-2 justify-between items-center pointer-events-none">
        
        <!-- Left Map Options -->
        <div class="bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-xl shadow-lg border border-slate-200/80 flex items-center gap-3 pointer-events-auto">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-layer-group text-amber-500"></i> 지도 스타일:
          </span>
          <select id="tileStyleSelect" class="text-xs bg-transparent border-none text-slate-700 font-medium focus:outline-none cursor-pointer">
            <option value="esri_street" selected>Esri World Street (표준 지도)</option>
            <option value="esri_topo">Esri Topographic (지형 지도)</option>
            <option value="esri_gray">Esri Light Gray (밝은 모드)</option>
            <option value="esri_sat">Esri World Imagery (위성 지도)</option>
            <option value="osm_fr">OpenStreetMap France (공용 지도)</option>
          </select>
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-2 pointer-events-auto">
          <button id="btnFitBounds" class="bg-white/90 hover:bg-white text-slate-700 font-semibold text-xs px-3 py-2 rounded-xl shadow-lg border border-slate-200/80 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-expand text-slate-500"></i>
            <span>전체 마커 한눈에 보기</span>
          </button>
          <button id="btnToggleCluster" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-2 rounded-xl shadow-lg transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-circle-nodes"></i>
            <span id="clusterBtnText">클러스터링 ON</span>
          </button>
        </div>
      </div>

      <!-- Leaflet Map Div -->
      <div id="map" class="w-full h-full"></div>

      <!-- Toast Notification Container -->
      <div id="toastContainer" class="absolute bottom-5 right-5 z-30 flex flex-col gap-2 pointer-events-none"></div>

    </main>

  </div>

  <script>
    // Default Sample Dataset: 경기도 시흥시 공공청사 자가용 태양광발전소 설치 현황
    const SAMPLE_CSV_DATA = `연번,시설명,위치,위도,경도,설비용량(kW),설치년도,담당부서
1,시흥시청,경기도 시흥시 시청로 20,37.380214,126.802891,150.0,2018,회계과
2,정왕3동 행정복지센터,경기도 시흥시 정왕대로 28,37.348521,126.736210,30.0,2020,행정지원과
3,신현동 주민센터,경기도 시흥시 포동로 12,37.404185,126.785290,25.0,2019,신현동
4,대야동 평생학습관,경기도 시흥시 은행로 173,37.443120,126.786541,50.0,2021,평생학습과
5,시흥시 평생학습원,경기도 시흥시 소래산길 11,37.385012,126.801045,40.0,2022,평생학습과
6,은행동 행정복지센터,경기도 시흥시 뱀내장터로 21,37.446811,126.797520,35.0,2020,은행동
7,목감동 행정복지센터,경기도 시흥시 목감우회로 39,37.381140,126.851230,30.0,2021,목감동
8,매화동 행정복지센터,경기도 시흥시 매화로 43,37.408120,126.828510,20.0,2019,매화동
9,배곧동 행정복지센터,경기도 시흥시 배곧4로 82,37.369540,126.726110,60.0,2022,배곧동
10,능곡동 행정복지센터,경기도 시흥시 능곡번영길 25,37.368810,126.812340,30.0,2020,능곡동
11,시흥시 중앙도서관,경기도 시흥시 정왕대로 233,37.352100,126.738810,70.0,2017,도서관관리과
12,월곶동 주민센터,경기도 시흥시 월곶해안로 165,37.391210,126.741120,25.0,2021,월곶동
13,군자동 행정복지센터,경기도 시흥시 군자로 484,37.348120,126.772340,30.0,2018,군자동
14,과림동 주민센터,경기도 시흥시 과림근로자로 30,37.436510,126.831520,20.0,2020,과림동
15,시흥시 체육관,경기도 시흥시 서해안로 1591,37.442810,126.789120,100.0,2019,체육진흥과
16,연성동 행정복지센터,경기도 시흥시 하중로 225,37.392150,126.804110,35.0,2021,연성동
17,장곡동 행정복지센터,경기도 시흥시 인선길 24,37.375120,126.786110,28.0,2022,장곡동
18,정왕본동 행정복지센터,경기도 시흥시 정왕신길로 213,37.351230,126.745120,45.0,2018,정왕본동
19,거모동 문화복지센터,경기도 시흥시 군자로 511,37.342120,126.781230,40.0,2020,문화예술과
20,시흥시 청소년수련관,경기도 시흥시 은행로 179,37.445120,126.788120,80.0,2019,청소년과`;

    let map = null;
    let markerClusterGroup = null;
    let regularMarkerGroup = null;
    let isClusteringEnabled = true;

    let parsedRawData = [];
    let currentHeaders = [];
    let mappedMarkersData = [];

    let latColumn = "";
    let lngColumn = "";
    let labelColumn = "";

    // Tile Layer definitions with maxNativeZoom to prevent "Map data not yet available" missing tiles
    const tileLayers = {
      esri_street: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        maxNativeZoom: 18,
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS'
      }),
      esri_topo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        maxNativeZoom: 18,
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom'
      }),
      esri_gray: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        maxNativeZoom: 18,
        attribution: 'Tiles &copy; Esri, HERE, Garmin, USGS'
      }),
      esri_sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19,
        maxNativeZoom: 18,
        attribution: 'Tiles &copy; Esri, DigitalGlobe, GeoEye'
      }),
      osm_fr: L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
        maxZoom: 20,
        maxNativeZoom: 19,
        subdomains: 'abc',
        attribution: '&copy; OpenStreetMap France'
      })
    };

    let activeTileLayer = tileLayers.esri_street;

    window.addEventListener('DOMContentLoaded', () => {
      try {
        initMap();
        setupEventListeners();
        // Auto load default sample dataset on launch
        loadCsvData(SAMPLE_CSV_DATA, "경기도 시흥시_공공청사 자가용 태양광발전소 설치 현황_20260828.csv");
      } catch(e) {
        console.error("Initialization error:", e);
      }
    });

    function initMap() {
      // Default centered near Gyeonggi Siheung City Hall
      map = L.map('map', {
        center: [37.3802, 126.8029],
        zoom: 12,
        zoomControl: false
      });

      // Add Zoom Control to bottom right
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Add default tile layer
      activeTileLayer.addTo(map);

      // Initialize Marker Groups
      markerClusterGroup = L.markerClusterGroup({
        chunkedLoading: true,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
      });

      regularMarkerGroup = L.layerGroup();

      map.addLayer(markerClusterGroup);

      // Resize map on viewport changes
      setTimeout(() => { map.invalidateSize(); }, 300);
    }

    function setupEventListeners() {
      // Drag and drop zone
      const dropZone = document.getElementById('dropZone');
      const csvFileInput = document.getElementById('csvFileInput');

      dropZone.addEventListener('click', () => csvFileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('border-amber-500', 'bg-amber-50/50');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('border-amber-500', 'bg-amber-50/50');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-amber-500', 'bg-amber-50/50');
        if (e.dataTransfer.files.length > 0) {
          handleFileSelect(e.dataTransfer.files[0]);
        }
      });

      csvFileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0]);
        }
      });

      // Sample dataset buttons
      document.getElementById('btnLoadSample').addEventListener('click', () => {
        loadCsvData(SAMPLE_CSV_DATA, "경기도 시흥시_공공청사 자가용 태양광발전소 설치 현황_20260828.csv");
        showToast("시흥시 태양광 예시 데이터가 로드되었습니다.", "success");
      });

      document.getElementById('btnDownloadSampleCsv').addEventListener('click', downloadSampleCsv);

      // Apply mapping button
      document.getElementById('btnApplyMapping').addEventListener('click', () => {
        latColumn = document.getElementById('selectLat').value;
        lngColumn = document.getElementById('selectLng').value;
        labelColumn = document.getElementById('selectLabel').value;

        if (!latColumn || !lngColumn) {
          showToast("위도와 경도 컬럼을 모두 선택해주세요.", "error");
          return;
        }

        renderMapMarkers();
        showToast("지도 좌표가 갱신되었습니다.", "info");
      });

      // Search Filter
      document.getElementById('searchInput').addEventListener('input', (e) => {
        filterDataList(e.target.value);
      });

      // Tile Layer Select
      document.getElementById('tileStyleSelect').addEventListener('change', (e) => {
        const selected = e.target.value;
        if (tileLayers[selected]) {
          map.removeLayer(activeTileLayer);
          activeTileLayer = tileLayers[selected];
          activeTileLayer.addTo(map);
        }
      });

      // Fit Bounds Button
      document.getElementById('btnFitBounds').addEventListener('click', fitMapToBounds);

      // Toggle Cluster Button
      document.getElementById('btnToggleCluster').addEventListener('click', () => {
        isClusteringEnabled = !isClusteringEnabled;
        const btnText = document.getElementById('clusterBtnText');
        
        if (isClusteringEnabled) {
          map.removeLayer(regularMarkerGroup);
          map.addLayer(markerClusterGroup);
          btnText.textContent = "클러스터링 ON";
        } else {
          map.removeLayer(markerClusterGroup);
          map.addLayer(regularMarkerGroup);
          btnText.textContent = "클러스터링 OFF";
        }
      });
    }

    function handleFileSelect(file) {
      if (!file.name.endsWith('.csv') && !file.name.endsWith('.txt')) {
        showToast("CSV 파일만 업로드할 수 있습니다.", "error");
        return;
      }

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        dynamicTyping: false,
        encoding: "UTF-8",
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            processParsedCSV(results.data, file.name);
            showToast(`${file.name} 읽기 성공 (${results.data.length}행)`, "success");
          } else {
            showToast("유효한 데이터가 포함되어 있지 않은 CSV 파일입니다.", "error");
          }
        },
        error: function(err) {
          showToast("CSV 파싱 오류: " + err.message, "error");
        }
      });
    }

    function loadCsvData(csvText, filename) {
      Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        dynamicTyping: false,
        complete: function(results) {
          processParsedCSV(results.data, filename);
        }
      });
    }

    function processParsedCSV(data, filename) {
      parsedRawData = data;
      currentHeaders = Object.keys(data[0] || {});

      // Auto detect columns
      latColumn = autoDetectColumn(currentHeaders, ['위도', 'lat', 'latitude', 'y', 'y좌표']);
      lngColumn = autoDetectColumn(currentHeaders, ['경도', 'lng', 'lon', 'longitude', 'x', 'x좌표']);
      labelColumn = autoDetectColumn(currentHeaders, ['시설명', '명칭', '이름', 'name', 'title', '위치', '주소']);

      // Populate Select Options
      populateDropdown('selectLat', currentHeaders, latColumn);
      populateDropdown('selectLng', currentHeaders, lngColumn);
      populateDropdown('selectLabel', currentHeaders, labelColumn);

      // Update mapping status tag
      const statusTag = document.getElementById('mappingStatus');
      statusTag.textContent = `${currentHeaders.length}개 컬럼 감지됨`;
      statusTag.className = "text-[11px] font-medium text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200";

      // Render map markers & sidebar list
      renderMapMarkers();
    }

    function autoDetectColumn(headers, keywords) {
      for (const keyword of keywords) {
        const found = headers.find(h => h.trim().toLowerCase() === keyword.toLowerCase() || h.trim().toLowerCase().includes(keyword.toLowerCase()));
        if (found) return found;
      }
      return headers[0] || "";
    }

    function populateDropdown(elementId, headers, selectedValue) {
      const select = document.getElementById(elementId);
      select.innerHTML = '<option value="">-- 선택 --</option>';
      headers.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = h;
        if (h === selectedValue) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function renderMapMarkers() {
      try {
        // Clear existing markers
        markerClusterGroup.clearLayers();
        regularMarkerGroup.clearLayers();

        mappedMarkersData = [];
        let validCount = 0;
        let invalidCount = 0;
        let totalCapacityKw = 0;

        const bounds = L.latLngBounds();

        parsedRawData.forEach((row, index) => {
          const rawLat = row[latColumn];
          const rawLng = row[lngColumn];

          const lat = parseFloat(rawLat);
          const lng = parseFloat(rawLng);

          // Check valid lat/lng boundaries
          if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            validCount++;

            // Extract solar capacity if available in standard row
            const cap = parseFloat(row['설비용량(kW)'] || row['용량'] || row['capacity'] || 0);
            if (!isNaN(cap)) totalCapacityKw += cap;

            const labelText = row[labelColumn] || `포인트 #${index + 1}`;
            
            // Custom Styled Icon
            const customIcon = L.divIcon({
              className: 'custom-leaflet-icon',
              html: `
                <div class="custom-marker bg-gradient-to-tr from-amber-600 to-amber-400 border-2 border-white text-slate-950 w-8 h-8 font-bold text-xs">
                  <i class="fa-solid fa-solar-panel text-white text-xs"></i>
                </div>
              `,
              iconSize: [32, 32],
              iconAnchor: [16, 16],
              popupAnchor: [0, -16]
            });

            // Create Marker
            const marker = L.marker([lat, lng], { icon: customIcon });

            // Create Rich Popup HTML
            const popupContent = createPopupHtml(labelText, row, lat, lng);
            marker.bindPopup(popupContent, { maxWidth: 300 });

            // Store Marker Reference
            const itemData = {
              id: index,
              lat,
              lng,
              label: labelText,
              row,
              marker
            };

            mappedMarkersData.push(itemData);

            // Add to Cluster & Regular Layers
            markerClusterGroup.addLayer(marker);
            regularMarkerGroup.addLayer(marker);

            bounds.extend([lat, lng]);
          } else {
            invalidCount++;
          }
        });

        // Update Statistics
        document.getElementById('statValidCount').textContent = validCount.toLocaleString();
        document.getElementById('statTotalCapacity').textContent = Math.round(totalCapacityKw).toLocaleString();
        document.getElementById('statInvalidCount').textContent = invalidCount.toLocaleString();
        document.getElementById('statTotalRows').textContent = parsedRawData.length.toLocaleString();

        // Update List Side View
        renderDataList(mappedMarkersData);

        // Adjust Map Camera safely
        if (validCount > 0 && bounds.isValid()) {
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        }
      } catch(err) {
        console.error("Error rendering markers:", err);
      }
    }

    function createPopupHtml(title, row, lat, lng) {
      let detailsHtml = '';
      
      // Filter key properties to display in popup
      Object.keys(row).forEach(key => {
        if (key !== latColumn && key !== lngColumn && row[key] !== "") {
          detailsHtml += `
            <div class="flex justify-between py-1 border-b border-slate-100 text-xs">
              <span class="text-slate-400 font-medium">${key}:</span>
              <span class="text-slate-700 font-semibold text-right pl-2">${row[key]}</span>
            </div>
          `;
        }
      });

      const kakaoMapUrl = `https://map.kakao.com/link/map/${encodeURIComponent(title)},${lat},${lng}`;
      const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

      return `
        <div class="p-1">
          <div class="flex items-center gap-1.5 text-amber-600 font-bold text-sm mb-2 pb-1 border-b border-amber-100">
            <i class="fa-solid fa-location-dot"></i>
            <span>${title}</span>
          </div>
          <div class="max-h-48 overflow-y-auto pr-1 mb-3">
            ${detailsHtml}
          </div>
          <div class="text-[10px] text-slate-400 mb-2 font-mono">
            좌표: ${lat.toFixed(6)}, ${lng.toFixed(6)}
          </div>
          <div class="grid grid-cols-2 gap-1.5 pt-1">
            <a href="${kakaoMapUrl}" target="_blank" class="bg-amber-400 hover:bg-amber-300 text-slate-900 text-[11px] font-bold py-1.5 px-2 rounded text-center transition-colors">
              카카오 지도
            </a>
            <a href="${googleMapUrl}" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold py-1.5 px-2 rounded text-center transition-colors">
              구글 지도
            </a>
          </div>
        </div>
      `;
    }

    function renderDataList(items) {
      const container = document.getElementById('dataListContainer');
      document.getElementById('filteredCountText').textContent = `${items.length}건`;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-xs text-slate-400">
            일치하는 위치 데이터가 없습니다.
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      items.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-white hover:bg-amber-50/60 p-2.5 rounded-lg border border-slate-200/80 shadow-sm cursor-pointer transition-all group hover:border-amber-400";
        
        const locDetail = item.row['위치'] || item.row['주소'] || `위도: ${item.lat.toFixed(4)}, 경도: ${item.lng.toFixed(4)}`;
        const capDetail = item.row['설비용량(kW)'] ? `<span class="bg-amber-100 text-amber-800 font-bold px-1.5 py-0.5 rounded text-[10px]">${item.row['설비용량(kW)']} kW</span>` : '';

        div.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-800 group-hover:text-amber-700 truncate pr-2">${item.label}</span>
            ${capDetail}
          </div>
          <div class="text-[11px] text-slate-400 truncate mt-1">
            <i class="fa-solid fa-location-arrow text-[10px] mr-1"></i>${locDetail}
          </div>
        `;

        // Click to Focus on Map
        div.addEventListener('click', () => {
          map.setView([item.lat, item.lng], 16, { animate: true });
          
          if (isClusteringEnabled) {
            markerClusterGroup.zoomToShowLayer(item.marker, () => {
              item.marker.openPopup();
            });
          } else {
            item.marker.openPopup();
          }
        });

        container.appendChild(div);
      });
    }

    function filterDataList(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderDataList(mappedMarkersData);
        return;
      }

      const filtered = mappedMarkersData.filter(item => {
        const labelMatch = item.label.toLowerCase().includes(q);
        const rowMatch = Object.values(item.row).some(val => String(val).toLowerCase().includes(q));
        return labelMatch || rowMatch;
      });

      renderDataList(filtered);
    }

    function fitMapToBounds() {
      if (mappedMarkersData.length === 0) return;
      const pts = mappedMarkersData.map(d => [d.lat, d.lng]).filter(pt => !isNaN(pt[0]) && !isNaN(pt[1]));
      if (pts.length === 0) return;
      
      const bounds = L.latLngBounds(pts);
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    function downloadSampleCsv() {
      const blob = new Blob(["\uFEFF" + SAMPLE_CSV_DATA], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', '경기도_시흥시_공공청사_태양광발전소_설치현황.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("샘플 CSV 파일이 다운로드되었습니다.", "success");
    }

    function showToast(message, type = "info") {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const colors = {
        success: "bg-emerald-800 text-emerald-100 border-emerald-600",
        error: "bg-rose-800 text-rose-100 border-rose-600",
        info: "bg-slate-900 text-slate-100 border-slate-700"
      };

      const icons = {
        success: '<i class="fa-solid fa-circle-check text-emerald-400"></i>',
        error: '<i class="fa-solid fa-circle-exclamation text-rose-400"></i>',
        info: '<i class="fa-solid fa-circle-info text-amber-400"></i>'
      };

      toast.className = `px-4 py-2.5 rounded-xl border shadow-xl text-xs font-medium flex items-center gap-2 pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      toast.innerHTML = `${icons[type] || icons.info} <span>${message}</span>`;

      container.appendChild(toast);

      // Animate in
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      // Dismiss after 3 seconds
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
